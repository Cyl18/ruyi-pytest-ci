name: ruyi-pytest (riscv64 multi-distro)

on:
  workflow_dispatch:
    inputs:
      ruyi_repo:
        description: "Optional RUYI_REPO mirror (ISCAS/GITEE)"
        required: false
        default: ""
      pytest_args:
        description: "Extra arguments passed to pytest"
        required: false
        default: ""

jobs:
  pytest-riscv64:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        distro:
          - debian_trixie
          - debian_sid
          - ubuntu_jammy
          - ubuntu_noble
          - deepin_beige_riscv64
          - deepin_crimson_riscv64
          - openkylin

    env:
      RUYI_REPO: ${{ inputs.ruyi_repo }}
      PYTEST_ARGS: ${{ inputs.pytest_args }}

    steps:
      - name: Checkout ruyi-pytest-ci
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up QEMU for multi-arch emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image for ${{ matrix.distro }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/distros/${{ matrix.distro }}.Dockerfile
          tags: ruyi-pytest-ci:${{ matrix.distro }}
          load: true
          platforms: linux/riscv64
          cache-from: type=gha,scope=riscv64-${{ matrix.distro }}
          cache-to: type=gha,scope=riscv64-${{ matrix.distro }},mode=max

      - name: Run pytest in Docker (${{ matrix.distro }})
        run: |
          mkdir -p artifacts/${{ matrix.distro }}
          docker run --rm --platform=linux/riscv64 \
            -e RUYI_REPO \
            -e PYTEST_ARGS \
            -e DISTRO_ID=${{ matrix.distro }} \
            -v "$PWD/artifacts/${{ matrix.distro }}:/artifacts" \
            ruyi-pytest-ci:${{ matrix.distro }}

      - name: Upload artifacts for ${{ matrix.distro }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruyi-pytest-${{ matrix.distro }}
          path: artifacts/${{ matrix.distro }}
          if-no-files-found: warn
